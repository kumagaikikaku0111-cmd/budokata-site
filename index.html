<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>武道　形</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: #f7f4ed;
      color: #222;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Hiragino Sans",
        "Yu Gothic",
        "YuGothic",
        sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;

      animation: pageFadeIn 1.8s ease forwards;
    }

    .entrance {
      width: 100%;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding: 40px 24px;
    }

    .logo-link {
      display: block;
      text-decoration: none;

      opacity: 0;

      animation: logoFadeIn 1.8s ease 0.2s forwards;

      cursor: pointer;
    }

    .logo-link img {
      display: block;

      width: min(82vw, 460px);
      height: auto;

      transition:
        transform 0.5s ease,
        opacity 0.5s ease;
    }

    .logo-link:hover img {
      transform: scale(1.02);
      opacity: 0.88;
    }

    .enter-button {
      display: inline-block;

      margin-top: 42px;

      padding: 11px 34px;

      background: transparent;

      border: 1px solid #777;
      border-radius: 0;

      color: #333;

      font-size: 12px;
      letter-spacing: 0.28em;
      text-indent: 0.28em;

      text-decoration: none;

      cursor: pointer;

      opacity: 0;

      animation: buttonFadeIn 1.5s ease 0.9s forwards;

      transition:
        background-color 0.4s ease,
        color 0.4s ease,
        border-color 0.4s ease;
    }

    .enter-button:hover {
      background: #222;
      color: #f7f4ed;
      border-color: #222;
    }

    @keyframes pageFadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes logoFadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes buttonFadeIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <main class="entrance">

    <a href="home.html" class="logo-link">
      <img
        src="budokata_logo_.png"
        alt="武道　形"
      >
    </a>

    <a href="home.html" class="enter-button">
       TOUCH TO ENTER
    </a>

  </main>

</body>
</html>
