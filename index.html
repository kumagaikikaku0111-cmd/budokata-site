<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>武道　形</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: #f7f4ed;
      color: #222;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Hiragino Sans",
        "Yu Gothic",
        "YuGothic",
        sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;

      animation: pageFadeIn 1.8s ease forwards;
    }

    .entrance {
      width: 100%;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding: 40px 24px;
    }

    .logo-link {
      display: block;
      text-decoration: none;

      opacity: 0;
      animation: logoFadeIn 1.8s ease 0.2s forwards;

      cursor: pointer;
    }

    .logo-link img {
      display: block;

      width: min(68vw, 360px);
      height: auto;

      transition:
        transform 0.5s ease,
        opacity 0.5s ease;
    }

    .logo-link:hover img {
      transform: scale(1.02);
      opacity: 0.88;
    }

      padding: 11px 34px;
