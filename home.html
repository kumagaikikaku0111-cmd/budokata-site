<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>武道　形</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;

      background: #f7f4ed;
      color: #222;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Hiragino Sans",
        "Yu Gothic",
        "YuGothic",
        sans-serif;

      line-height: 1.8;
    }

    .container {
      width: min(900px, 88%);
      margin: 0 auto;
    }

    .lang-switcher {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 1000;

      display: flex;
      gap: 8px;
    }

    .lang-button {
      appearance: none;
      border: 1px solid #999;
      background: rgba(247, 244, 237, 0.92);
      color: #222;
      cursor: pointer;

      padding: 8px 12px;
      border-radius: 999px;

      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .lang-button:hover {
      background: #fff;
    }

    .lang-button.is-active {
      background: #222;
      color: #f7f4ed;
      border-color: #222;
    }

    .coming-soon-toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 1000;

      background: rgba(34, 34, 34, 0.92);
      color: #fff;
      padding: 12px 18px;
      border-radius: 999px;

      font-size: 13px;
      letter-spacing: 0.04em;

      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .coming-soon-toast.is-visible {
      opacity: 1;
    }

    /* =========================
       ファーストビュー
    ========================= */

    .hero {
      min-height: 72vh;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;

      padding: 80px 20px;
    }

    .hero-logo {
      width: min(65vw, 340px);
      height: auto;

      margin-bottom: 45px;
    }

    .hero-title {
      margin: 0;

      font-size: clamp(21px, 4vw, 32px);
      font-weight: 400;

      letter-spacing: 0.16em;
    }

    .hero-subtitle {
      margin-top: 18px;

      font-size: 13px;

      letter-spacing: 0.18em;

      color: #666;
    }

    section {
      padding: 80px 0;
    }

    .section-title {
      margin: 0 0 40px;

      text-align: center;

      font-size: 21px;
      font-weight: 400;

      letter-spacing: 0.18em;
    }

    .section-text {
      max-width: 650px;

      margin: 0 auto;

      text-align: center;

      font-size: 14px;

      line-height: 2.2;

      letter-spacing: 0.08em;

      color: #444;
    }

    .screenshots {
      display: flex;

      justify-content: center;
      align-items: flex-start;

      gap: 25px;

      margin-top: 50px;
    }

    .screenshot {
      width: 30%;

      aspect-ratio: 9 / 19;

      background: #e4e1da;

      border: 1px solid #d0ccc3;

      display: flex;

      justify-content: center;
      align-items: center;

      text-align: center;

      color: #999;

      font-size: 11px;

      letter-spacing: 0.08em;
    }

    .stores {
      display: flex;

      justify-content: center;

      gap: 20px;

      margin-top: 45px;
    }

    .store {
      width: 210px;

      padding: 17px 20px;

      border: 1px solid #999;

      text-align: center;
    }

    .store-name {
      display: block;

      font-size: 14px;

      letter-spacing: 0.12em;
    }

    .coming-soon {
      display: block;

      margin-top: 3px;

      font-size: 11px;

      color: #777;

      letter-spacing: 0.12em;
    }

    footer {
      padding: 55px 20px 35px;

      border-top: 1px solid #dedad1;

      text-align: center;

      color: #666;
    }

    .footer-title {
      font-size: 14px;

      letter-spacing: 0.16em;
    }

    .copyright {
      margin-top: 15px;

      font-size: 10px;

      color: #999;

      letter-spacing: 0.08em;
    }

    @media (max-width: 600px) {
      .hero {
        min-height: 70vh;

        padding: 70px 20px;
      }

      .hero-logo {
        width: min(70vw, 300px);

        margin-bottom: 35px;
      }

      .hero-title {
        font-size: 20px;

        line-height: 1.8;
      }

      .hero-subtitle {
        font-size: 12px;
      }

      section {
        padding: 65px 0;
      }

      .section-title {
        margin-bottom: 32px;

        font-size: 19px;
      }

      .section-text {
        font-size: 13px;

        line-height: 2.2;
      }

      .screenshots {
        gap: 10px;
      }

      .screenshot {
        width: 31%;

        font-size: 9px;
      }

      .stores {
        flex-direction: column;

        align-items: center;

        gap: 14px;
      }

      .store {
        width: min(280px, 80%);
      }
    }
  </style>
</head>

<body>
  <div class="lang-switcher" aria-label="Language switcher">
    <button class="lang-button is-active" type="button" id="jpnButton">JPN</button>
    <button class="lang-button" type="button" id="engButton">ENG</button>
  </div>

  <div class="coming-soon-toast" id="comingSoonToast" role="status" aria-live="polite">
    English version coming soon
  </div>

  <header class="hero">
    <img
      src="budokata_logo_.png"
      alt="武道　形"
      class="hero-logo"
      id="heroLogo"
    >

    <h1 class="hero-title" id="heroTitle">
      日本の武道の「形」を、いつでも。
    </h1>

    <p class="hero-subtitle" id="heroSubtitle">
      武道　形
    </p>
  </header>

  <main>
    <section>
      <div class="container">
        <h2 class="section-title" id="aboutTitle">
          武道　形
        </h2>

        <p class="section-text" id="aboutText">
          「武道　形」は、
          武道に受け継がれてきた「形」を
          学ぶためのアプリです。
          <br><br>
          動画と解説、ポイントを通して、
          いつでも形を学ぶことができます。
        </p>
      </div>
    </section>

    <section>
      <div class="container">
        <h2 class="section-title" id="screensTitle">
          アプリ画面
        </h2>

        <div class="screenshots">
          <div class="screenshot" id="shot1">SCREENSHOT 01</div>
          <div class="screenshot" id="shot2">SCREENSHOT 02</div>
          <div class="screenshot" id="shot3">SCREENSHOT 03</div>
        </div>
      </div>
    </section>

    <section>
      <div class="container">
        <h2 class="section-title" id="downloadTitle">
          DOWNLOAD
        </h2>

        <div class="stores">
          <div class="store">
            <span class="store-name" id="appStoreName">App Store</span>
            <span class="coming-soon" id="appStoreStatus">近日リリース</span>
          </div>

          <div class="store">
            <span class="store-name" id="googlePlayName">Google Play</span>
            <span class="coming-soon" id="googlePlayStatus">近日リリース</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-title" id="footerTitle">武道　形</div>
    <div class="copyright" id="copyright">© 武道　形</div>
  </footer>

  <script>
    const jpnButton = document.getElementById('jpnButton');
    const engButton = document.getElementById('engButton');
    const toast = document.getElementById('comingSoonToast');
    const heroTitle = document.getElementById('heroTitle');
    const heroSubtitle = document.getElementById('heroSubtitle');
    const aboutTitle = document.getElementById('aboutTitle');
    const aboutText = document.getElementById('aboutText');
    const screensTitle = document.getElementById('screensTitle');
    const downloadTitle = document.getElementById('downloadTitle');
    const appStoreStatus = document.getElementById('appStoreStatus');
    const googlePlayStatus = document.getElementById('googlePlayStatus');
    const footerTitle = document.getElementById('footerTitle');
    const copyright = document.getElementById('copyright');

    let toastTimer;

    const setLanguage = (lang) => {
      const isEnglish = lang === 'en';

      jpnButton.classList.toggle('is-active', !isEnglish);
      engButton.classList.toggle('is-active', isEnglish);
      document.documentElement.lang = isEnglish ? 'en' : 'ja';
      document.title = isEnglish ? 'Budo Kata' : '武道　形';

      heroTitle.textContent = isEnglish
        ? 'Anytime, learn the kata of Japanese budo.'
        : '日本の武道の「形」を、いつでも。';

      heroSubtitle.textContent = isEnglish
        ? 'Budo Kata'
        : '武道　形';

      aboutTitle.textContent = isEnglish ? 'Budo Kata' : '武道　形';
      aboutText.innerHTML = isEnglish
        ? '"Budo Kata" is an app for learning the kata passed down in Japanese budo.<br><br>Through videos, explanations, and key points, you can learn kata anytime.'
        : '「武道　形」は、<br>武道に受け継がれてきた「形」を<br>学ぶためのアプリです。<br><br>動画と解説、ポイントを通して、<br>いつでも形を学ぶことができます。';

      screensTitle.textContent = isEnglish ? 'App Screens' : 'アプリ画面';
      downloadTitle.textContent = 'DOWNLOAD';
      appStoreStatus.textContent = isEnglish ? 'Coming soon' : '近日リリース';
      googlePlayStatus.textContent = isEnglish ? 'Coming soon' : '近日リリース';
      footerTitle.textContent = isEnglish ? 'Budo Kata' : '武道　形';
      copyright.textContent = isEnglish ? '© Budo Kata' : '© 武道　形';
    };

    engButton.addEventListener('click', () => {
      setLanguage('en');
      toast.textContent = 'English version coming soon';
      toast.classList.add('is-visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('is-visible');
      }, 2000);
    });

    jpnButton.addEventListener('click', () => {
      setLanguage('ja');
      toast.classList.remove('is-visible');
    });
  </script>
</body>
</html>
