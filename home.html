<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>武道　形</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;

      background: #f7f4ed;
      color: #222;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Hiragino Sans",
        "Yu Gothic",
        "YuGothic",
        sans-serif;

      line-height: 1.8;
    }

    .container {
      width: min(900px, 88%);
      margin: 0 auto;
    }


    /* =========================
       ファーストビュー
    ========================= */

    .hero {
      min-height: 72vh;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;

      padding: 80px 20px;
    }

    .hero-logo {
      width: min(65vw, 340px);
      height: auto;

      margin-bottom: 45px;
    }

    .hero-title {
      margin: 0;

      font-size: clamp(21px, 4vw, 32px);
      font-weight: 400;

      letter-spacing: 0.16em;
    }

    .hero-subtitle {
      margin-top: 18px;

      font-size: 13px;

      letter-spacing: 0.18em;

      color: #666;
    }


    /* =========================
       セクション
    ========================= */

    section {
      padding: 80px 0;
    }

    .section-title {
      margin: 0 0 40px;

      text-align: center;

      font-size: 21px;
      font-weight: 400;

      letter-spacing: 0.18em;
    }

    .section-text {
      max-width: 650px;

      margin: 0 auto;

      text-align: center;

      font-size: 14px;

      line-height: 2.2;

      letter-spacing: 0.08em;

      color: #444;
    }


    /* =========================
       アプリ画面
    ========================= */

    .screenshots {
      display: flex;

      justify-content: center;
      align-items: flex-start;

      gap: 25px;

      margin-top: 50px;
    }

    .screenshot {
      width: 30%;

      aspect-ratio: 9 / 19;

      background: #e4e1da;

      border: 1px solid #d0ccc3;

      display: flex;

      justify-content: center;
      align-items: center;

      text-align: center;

      color: #999;

      font-size: 11px;

      letter-spacing: 0.08em;
    }


    /* =========================
       ダウンロード
    ========================= */

    .stores {
      display: flex;

      justify-content: center;

      gap: 20px;

      margin-top: 45px;
    }

    .store {
      width: 210px;

      padding: 17px 20px;

      border: 1px solid #999;

      text-align: center;
    }

    .store-name {
      display: block;

      font-size: 14px;

      letter-spacing: 0.12em;
    }

    .coming-soon {
      display: block;

      margin-top: 3px;

      font-size: 11px;

      color: #777;

      letter-spacing: 0.12em;
    }


    /* =========================
       フッター
    ========================= */

    footer {
      padding: 55px 20px 35px;

      border-top: 1px solid #dedad1;

      text-align: center;

      color: #666;
    }

    .footer-title {
      font-size: 14px;

      letter-spacing: 0.16em;
    }

    .copyright {
      margin-top: 15px;

      font-size: 10px;

      color: #999;

      letter-spacing: 0.08em;
    }


    /* =========================
       スマートフォン
    ========================= */

    @media (max-width: 600px) {

      .hero {
        min-height: 70vh;

        padding: 70px 20px;
      }

      .hero-logo {
        width: min(70vw, 300px);

        margin-bottom: 35px;
      }

      .hero-title {
        font-size: 20px;

        line-height: 1.8;
      }

      .hero-subtitle {
        font-size: 12px;
      }

      section {
        padding: 65px 0;
      }

      .section-title {
        margin-bottom: 32px;

        font-size: 19px;
      }

      .section-text {
        font-size: 13px;

        line-height: 2.2;
      }

      .screenshots {
        gap: 10px;
      }

      .screenshot {
        width: 31%;

        font-size: 9px;
      }

      .stores {
        flex-direction: column;

        align-items: center;

        gap: 14px;
      }

      .store {
        width: min(280px, 80%);
      }
    }

  </style>
</head>


<body>


  <!-- =========================
       ファーストビュー
  ========================= -->

  <header class="hero">

    <img
      src="budokata_logo_.png"
      alt="武道　形"
      class="hero-logo"
    >

    <h1 class="hero-title">
      日本の武道の「形」を、いつでも。
    </h1>

    <p class="hero-subtitle">
      武道　形
    </p>

  </header>


  <main>


    <!-- =========================
         アプリについて
    ========================= -->

    <section>

      <div class="container">

        <h2 class="section-title">
          武道　形
        </h2>

        <p class="section-text">
          「武道　形」は、
          武道に受け継がれてきた「形」を
          学ぶためのアプリです。
          <br><br>
          動画と解説、ポイントを通して、
          いつでも形を学ぶことができます。
        </p>

      </div>

    </section>


    <!-- =========================
         アプリ画面
    ========================= -->

    <section>

      <div class="container">

        <h2 class="section-title">
          アプリ画面
        </h2>

        <div class="screenshots">

          <div class="screenshot">
            SCREENSHOT 01
          </div>

          <div class="screenshot">
            SCREENSHOT 02
          </div>

          <div class="screenshot">
            SCREENSHOT 03
          </div>

        </div>

      </div>

    </section>


    <!-- =========================
         ダウンロード
    ========================= -->

    <section>

      <div class="container">

        <h2 class="section-title">
          DOWNLOAD
        </h2>

        <div class="stores">

          <div class="store">

            <span class="store-name">
              App Store
            </span>

            <span class="coming-soon">
              近日リリース
            </span>

          </div>


          <div class="store">

            <span class="store-name">
              Google Play
            </span>

            <span class="coming-soon">
              近日リリース
            </span>

          </div>

        </div>

      </div>

    </section>


  </main>


  <!-- =========================
       フッター
  ========================= -->

  <footer>

    <div class="footer-title">
      武道　形
    </div>

    <div class="copyright">
      © 武道　形
    </div>

  </footer>


</body>
</html>
